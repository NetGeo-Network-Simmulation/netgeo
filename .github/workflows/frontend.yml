# =============================================================================
# NetGeo CI — Frontend (lint + typecheck + build)
# =============================================================================
name: frontend-ci

# Runs on every PR so the required "build" check always reports; the heavy steps
# are gated on whether frontend files actually changed. See backend.yml for why
# a paths: filter cannot be used on a required check.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect frontend changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch -q origin "${{ github.base_ref }}"
            files=$(git diff --name-only "$base"...HEAD)
          else
            files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo frontend/)
          fi
          if echo "$files" | grep -qE '^(frontend/|\.github/workflows/frontend\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No frontend changes; skipping typecheck+build."
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.changed.outputs.run == 'true'
        working-directory: frontend
        run: npm ci || npm install

      - name: Typecheck
        if: steps.changed.outputs.run == 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        if: steps.changed.outputs.run == 'true'
        working-directory: frontend
        run: npm run build
