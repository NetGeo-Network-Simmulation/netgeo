[pytest]
# asyncio_mode=auto: fungsi test async dijalankan tanpa perlu marker eksplisit.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
addopts = -q
markers =
    podman: needs a reachable rootless podman REST socket (skipped otherwise)
    oracle: cross-checks the sim engine against a real NOS container (needs podman; slower and heavier than the podman-smoke gate, so NOT selected by its `-m podman` filter — see tests/ORACLE_HARNESS.md)
