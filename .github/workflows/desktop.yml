# =============================================================================
# NetGeo CI — Desktop artifact (UNSIGNED)
# =============================================================================
# Builds the PyInstaller all-in-one bundle (D1 edition, docs/design/13) for
# Windows and Linux, wraps it into an install-ready artifact per platform
# (Windows: Inno Setup .exe installer; Linux: tarball + packaging/linux/
# install.sh), and uploads both the raw onedir bundle and the wrapped
# artifact. No AppImage/.deb/.rpm yet — that remains a later track. No
# signing yet — see the stub step below.
#
# Trigger: manual + release tags only (not every push — desktop builds are
# comparatively expensive wall-clock).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            packaging/requirements.txt

      - name: Install backend + packaging dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r packaging/requirements.txt

      - name: PyInstaller build
        working-directory: packaging
        run: pyinstaller netgeo.spec --distpath ./dist --workpath ./build --noconfirm

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: netgeo-desktop-${{ matrix.os }}-unsigned
          path: packaging/dist/netgeo/
          if-no-files-found: error

      - name: Build Windows installer (Inno Setup, unsigned)
        if: matrix.os == 'windows-latest'
        working-directory: packaging/windows
        run: iscc netgeo.iss

      - name: Upload Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: netgeo-installer-windows-unsigned
          path: packaging/windows/dist-installer/*.exe
          if-no-files-found: error

      - name: Build Linux install-ready tarball
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p packaging/tarball/netgeo
          cp -r packaging/dist/netgeo packaging/tarball/netgeo/netgeo
          cp -r packaging/linux packaging/tarball/netgeo/linux
          cp -r packaging/icons packaging/tarball/netgeo/icons
          tar -C packaging/tarball -czf packaging/netgeo-linux-x86_64.tar.gz netgeo

      - name: Upload Linux install-ready tarball
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: netgeo-installer-linux-unsigned
          path: packaging/netgeo-linux-x86_64.tar.gz
          if-no-files-found: error

      # -----------------------------------------------------------------
      # Windows code signing — SIGNPATH STUB, NOT WIRED UP.
      #
      # Per docs/design/13-DISTRIBUTION-PLAN.md "SignPath OSS — concrete
      # integration notes": apply at signpath.org (OSS program, free, cert
      # issued to "SignPath Foundation"), then use
      # signpath/github-action-submit-signing-request with:
      #   api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #   organization-id: <SignPath org id>
      #   project-slug: netgeo
      #   signing-policy-slug: release-signing
      #   artifact-configuration-slug: <config slug>
      #   github-artifact-id: <id from the upload-artifact step above>
      #   wait-for-completion: true
      #   output-artifact-directory: packaging/dist-signed
      # This step is intentionally disabled (if: false) until the SignPath
      # OSS application is approved and the above secrets exist in this repo.
      - name: Submit Windows signing request (SignPath, DISABLED)
        if: false
        run: echo "signing not wired up yet — see comment above"
