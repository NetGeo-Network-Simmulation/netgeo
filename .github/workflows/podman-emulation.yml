# =============================================================================
# NetGeo CI — Podman emulation smoke test (N-2b, required merge gate)
# =============================================================================
# Runs the `podman`-marked tests (real FRR container spawn/destroy via
# rootless podman) on a genuine ubuntu-latest GitHub Actions runner, not just
# Surya's dev machine.
#
# MERGE GATE: this job is a required status check in `main`'s branch
# protection (`["test","build","podman-smoke"]`, strict). It went green three
# runs in a row per the N-2b plan (nos-emulation-track-plan.md), the bar that
# plan set for promoting it out of non-blocking status — so a failure here now
# blocks merging, same as `test`/`build`.
name: podman-emulation-ci

on:
  push:
  pull_request:

jobs:
  podman-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ensure podman is installed
        run: command -v podman || (sudo apt-get update && sudo apt-get install -y podman)

      - name: Start rootless podman socket
        run: |
          set -e
          sock="/run/user/$(id -u)/podman/podman.sock"
          mkdir -p "$(dirname "$sock")"
          if systemctl --user enable --now podman.socket 2>/dev/null; then
            echo "podman.socket started via systemd --user"
          else
            echo "systemd --user session unavailable; starting podman system service manually"
            nohup podman system service --time=0 "unix://${sock}" >/tmp/podman-service.log 2>&1 &
            sleep 2
          fi
          ls -l "$sock"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull FRR image
        run: podman pull quay.io/frrouting/frr:10.7.0

      - name: Test (pytest -m podman)
        working-directory: backend
        run: pytest -m podman -q
